name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 155, Zen 1.22.3b
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Website (if it only happens on one site)
  - type: textarea
    id: errors
    attributes:
      label: Error text or console output
      description: Remove your API key before pasting anything.
      render: text
